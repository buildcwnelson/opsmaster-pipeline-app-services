version: "3.8"

services:
  # =========================================================================
  # 1. CORE APPLICATION ENGINE (Single Unified Microservice)
  # =========================================================================
  app-engine:
    build:
      context: ./app-services
      dockerfile: Dockerfile
    container_name: opsmaster-app-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/clinical_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_VITALS_STREAM: "vitals:stream"
      REDIS_ALERTS_CHANNEL: "vitals:alerts:critical"
      REDIS_SESSION_PREFIX: "opsmaster:session:"
      SLIDING_WINDOW_SECONDS: "30"
      SLIDING_WINDOW_MIN_SAMPLES: "2"
      THRESHOLD_TACHYCARDIA_BPM: "140.0"
      THRESHOLD_BRADYCARDIA_BPM: "45.0"
      THRESHOLD_HYPOXEMIA_SPO2: "90.0"
      THRESHOLD_CRITICAL_HYPOXEMIA_SPO2: "85.0"
      THRESHOLD_SYSTOLIC_BP_HIGH: "180.0"
      SHUTDOWN_TIMEOUT_SECONDS: "10"
      ENABLE_MOCK_FALLBACK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/livez"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - opsmaster-net

  # =========================================================================
  # 2. PERSISTENCE: PostgreSQL 16
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: opsmaster-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: clinical_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opsmaster-net

  # =========================================================================
  # 3. STATE & QUEUE: Redis 7
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: opsmaster-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opsmaster-net

  # =========================================================================
  # ON-DEMAND LOAD TESTING: k6 Synthetic Telemetry Simulator (Profile: "test")
  # =========================================================================
  k6:
    image: grafana/k6:latest
    container_name: opsmaster-k6
    profiles:
      - test
    environment:
      TARGET_URL: "http://app-engine:8080/api/v1/vitals"
      VIRTUAL_DEVICES: "1000"
      INJECT_ANOMALIES: "false"
      INJECT_LATENCY: "false"
      INJECT_MALFORMED_RATE: "0.0"
    volumes:
      - ./scripts/k6:/scripts
    entrypoint: ["k6", "run", "/scripts/telemetry-load.js"]
    depends_on:
      app-engine:
        condition: service_healthy
    networks:
      - opsmaster-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  opsmaster-net:
    driver: bridge
