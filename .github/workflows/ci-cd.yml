name: Production SemVer CI/CD (Multi-Stage Pipeline)

on:
  # Trigger on official SemVer Git release tags (e.g. v1.0.0, v1.2.3, v2.0.0-rc1)
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  # Trigger on Pull Requests targeting the main branch for pre-merge validation
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  # Allow manual workflow dispatch from GitHub Actions web console
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force security scan execution'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # STAGE 1: BUILD & METADATA
  # =========================================================================
  build:
    name: 1. Build Container & Tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      primary_tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Docker Metadata and Semantic Version Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/${{ vars.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # 1. SemVer Git Tags (e.g., v1.2.3) -> 1.2.3, 1.2 (floating minor), 1 (floating major)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 2. Latest alias only on valid release tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # 3. Push to main branch -> tag as 'main'
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # 4. Pull Requests -> tag as 'pr-<PR_NUMBER>'
            type=ref,event=pr,prefix=pr-
            # 5. Commit short SHA traceability tag across all events
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.13.1

      - name: Build Container Image & Export Tarball
        uses: docker/build-push-action@v5
        with:
          context: ./app-services
          file: ./app-services/Dockerfile
          outputs: type=docker,dest=/tmp/app-engine.tar
          tags: ${{ steps.meta.outputs.tags }}

      - name: Upload Docker Image Artifact for Subsequent Stages
        uses: actions/upload-artifact@v4
        with:
          name: app-engine-image
          path: /tmp/app-engine.tar
          retention-days: 1

  # =========================================================================
  # STAGE 2: SECURITY SCAN (Anchore Grype & SARIF Upload)
  # =========================================================================
  security-scan:
    name: 2. Security Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-engine-image
          path: /tmp

      - name: Load Image into Docker Daemon
        run: docker load -i /tmp/app-engine.tar

      - name: Run Anchore Grype Vulnerability Scan
        id: grype-scan
        uses: anchore/scan-action@v5
        with:
          image: ${{ needs.build.outputs.primary_tag }}
          # Fail pipeline if vulnerabilities at or above severity-cutoff are found
          fail-build: true
          severity-cutoff: high
          output-format: sarif
        continue-on-error: false

      - name: Upload Grype SARIF Findings to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype-scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: anchore-grype

  # =========================================================================
  # STAGE 3: PUBLISH TO GOOGLE ARTIFACT REGISTRY
  # =========================================================================
  publish:
    name: 3. Publish to Artifact Registry
    needs: [build, security-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for keyless WIF OIDC token exchange

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-engine-image
          path: /tmp

      - name: Load Image into Docker Daemon
        run: docker load -i /tmp/app-engine.tar

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          # Keyless OIDC authentication - NO service account JSON keys
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Push Container Tags to Google Artifact Registry
        run: |
          for tag in ${{ needs.build.outputs.tags }}; do
            echo "Pushing image tag: $tag"
            docker push "$tag"
          done

  # =========================================================================
  # STAGE 4: BUILD SUMMARY REPORT
  # =========================================================================
  summary:
    name: 4. Pipeline Summary Report
    needs: [build, security-scan, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate CI/CD Summary Report
        run: |
          echo "## 🚀 OpsMaster Pipeline Build & Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Build** | ${{ needs.build.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }} | Container built & SemVer tags calculated |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Security Scan** | ${{ needs.security-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Anchore Grype scan (Cutoff: HIGH/CRITICAL) |" >> $GITHUB_STEP_SUMMARY
          echo "| **3. Publish (GAR)** | ${{ needs.publish.result == 'success' && '✅ PUSHED' || (github.event_name == 'pull_request' && '⏸️ SKIPPED (PR Preview)' || '❌ FAILED') }} | Keyless WIF push to Google Artifact Registry |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Target Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.build.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
