name: Production SemVer CI/CD with Anchore Grype & GCP WIF

on:
  # Trigger on official SemVer Git release tags (e.g. v1.0.0, v1.2.3, v2.0.0-rc1)
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  # Trigger on Pull Requests targeting the main branch for pre-merge scanning
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  # Allow manual workflow dispatch from GitHub Actions web console
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force security scan execution'
        required: false
        default: 'true'
        type: boolean

# Least privilege security permissions (HIPAA & DevSecOps standards)
permissions:
  contents: read           # Read repo contents for checkout
  id-token: write          # Required for GCP Workload Identity Federation OIDC token exchange
  security-events: write   # Required for uploading SARIF reports to GitHub Code Scanning tab

# Concurrency group ensures outdated builds for the same PR/branch are superseded
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LOCAL_IMAGE_NAME: 'app-engine-local'

jobs:
  build-scan-publish:
    name: Build, Security Scan & Publish
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT CODE REPOSITORY
      # =========================================================================
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          # Full history required for accurate git metadata and SemVer resolution
          fetch-depth: 0

      # =========================================================================
      # 2. EXTRACT DOCKER METADATA & SEMVER TAGS
      # =========================================================================
      - name: Extract Docker Metadata and Semantic Version Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/${{ vars.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # 1. SemVer Git Tags (e.g., v1.2.3) -> 1.2.3, 1.2 (floating minor), 1 (floating major)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 2. Latest alias only on valid release tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # 3. Push to main branch -> tag as 'main'
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # 4. Pull Requests -> tag as 'pr-<PR_NUMBER>'
            type=ref,event=pr,prefix=pr-
            # 5. Commit short SHA traceability tag across all events
            type=sha,prefix=sha-,format=short

      # =========================================================================
      # 3. SET UP DOCKER BUILDX & LAYER CACHING
      # =========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.13.1

      # =========================================================================
      # 4. KEYLESS GCP AUTHENTICATION (Workload Identity Federation)
      # =========================================================================
      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: gcp-auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          # Keyless OIDC authentication - NO service account JSON keys
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      # =========================================================================
      # 5. DOCKER LOGIN TO GOOGLE ARTIFACT REGISTRY
      # =========================================================================
      - name: Log in to Google Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      # =========================================================================
      # 6. BUILD CONTAINER IMAGE LOCALLY (LOAD INTO DOCKER DAEMON)
      # =========================================================================
      - name: Build Container Image Locally for Security Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./app-services
          file: ./app-services/Dockerfile
          load: true # Loads image into local Docker engine so scanner can inspect it
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.LOCAL_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================================================
      # 7. RUN ANCHORE GRYPE VULNERABILITY SCANNER
      # =========================================================================
      - name: Run Anchore Grype Vulnerability Scan
        id: grype-scan
        uses: anchore/scan-action@v5
        with:
          image: ${{ env.LOCAL_IMAGE_NAME }}:${{ github.sha }}
          # Fail pipeline if vulnerabilities at or above severity-cutoff are found
          fail-build: true
          severity-cutoff: high
          output-format: sarif
        continue-on-error: false

      # =========================================================================
      # 8. UPLOAD SARIF REPORT TO GITHUB CODE SCANNING
      # =========================================================================
      - name: Upload Grype SARIF Findings to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype-scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: anchore-grype

      # =========================================================================
      # 9. PUSH VERIFIED CONTAINER IMAGE TO ARTIFACT REGISTRY
      # =========================================================================
      - name: Push Container Image to Google Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./app-services
          file: ./app-services/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # =========================================================================
      # 10. GENERATE WORKFLOW STEP SUMMARY REPORT
      # =========================================================================
      - name: Generate CI/CD Step Summary
        if: always()
        run: |
          echo "## 🚀 OpsMaster Pipeline Build & Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Grype Scan Status** | ${{ steps.grype-scan.outcome == 'success' && '✅ PASSED (No High/Critical CVEs)' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry Push Status** | ${{ github.event_name != 'pull_request' && '✅ PUSHED' || '⏸️ SKIPPED (PR Preview)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Target Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
